# Pylume Release（tag 触发的发布流水线）
#
# 与 ci.yml 的分工：ci.yml::package-smoke 是「发布前烟测门禁」（tag/手动触发，
# 只验证能打包 + bench 红线，产物丢弃）；本文件是「发布流水线」——tag v* 推送时
# 完整打包并把 NSIS 安装包挂到 GitHub Release。
#
# 触发方式：
#   git tag v0.1.0 && git push origin v0.1.0
# 注意：workflow 文件必须在 tag 指向的 commit 里才会触发——先把本文件推上主干，
# 再打 tag。
#
# 版本一致性守卫：tag 必须等于 `v` + tauri.conf.json 的 version
# （NSIS 产物文件名为 {productName}_{version}_x64-setup.exe，错位即发错包）。

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # gh release create 需要写权限

jobs:
  release:
    name: 打包 + bench 门禁 + 发布
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"

      - name: 版本一致性校验（tag vs tauri.conf.json）
        shell: pwsh
        run: |
          $conf = Get-Content shell/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$($conf.version)") {
            Write-Error "tag $tag 与 tauri.conf.json version v$($conf.version) 不一致——先同步版本再打 tag"
            exit 1
          }
          Write-Host "版本校验通过：$tag == v$($conf.version)"

      - name: 前端依赖
        working-directory: shell
        run: npm ci

      - name: 打包（NSIS，build-release.ps1 内含 intel release 构建 + vendored debugpy）
        shell: pwsh
        run: ./build-release.ps1 -SkipNpmInstall

      - name: bench 门禁（冷启动 < 1500ms / 内存 <= 600MB）
        shell: pwsh
        run: ./bench/collect-metrics.ps1 -Runs 2

      - name: 创建 GitHub Release 并上传安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $exe = Get-ChildItem "shell/src-tauri/target/release/bundle/nsis/*.exe" |
            Select-Object -First 1
          if (-not $exe) { Write-Error "NSIS 安装包未找到"; exit 1 }
          $tag = "${{ github.ref_name }}"
          Write-Host "asset: $($exe.Name)"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$($exe.FullName)" --clobber
          } else {
            gh release create $tag "$($exe.FullName)" --title "Pylume $tag" --generate-notes
          }

      - name: 上传安装包 artifact（备份，防止 Release 操作失败丢产物）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-${{ github.ref_name }}
          path: shell/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: 上传 bench 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-bench-${{ github.run_id }}
          path: bench/reports/metrics-*.md
          retention-days: 30
