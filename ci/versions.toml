# Pylume 版本锁定基线（S1-T07）
# 纪律：升级任何组件必须 PR + bench 回归全绿（开发计划 v2 §8）

[shell]
tauri = "2.11.5"          # Tauri 核心（cargo 依赖解析出的实际版本）
monaco-editor = "0.52.2"  # 前端编辑器（npm 精确锁定）
portable-pty = "0.9.0"    # 集成终端 PTY 后端（cargo，Windows ConPTY）
sysinfo = "0.39.6"        # 资源可观测（A-1：外壳/子进程内存与 CPU 采样）
rusqlite = "0.32.1"       # B3 SQLite 数据库工具（bundled：自带 SQLite C 源码，免系统库）
libsqlite3-sys = "0.30.1" # rusqlite bundled 的底层绑定（随 rusqlite 版本联动，勿单独改）
xterm = "5.5.0"           # 集成终端前端（@xterm/xterm）
xterm-addon-fit = "0.10.0" # xterm 自适应尺寸插件（@xterm/addon-fit）
vite = "6.4.3"
typescript = "5.x"
node = "22.12.0"
npm = "10.9.2"

[engines]
pyrefly = "1.3.1"                    # 默认静态引擎（`pyrefly lsp`）
basedpyright = "1.39.10"             # 备选引擎（`basedpyright-langserver --stdio`，~/.local/bin）
ruff = "0.16.1"                      # lint/format（Phase 1 后期接入 LSP 桥）

[toolchain]
python = "3.13.7"         # uv 管理（D:\py3\3.13.7）；系统默认 3.11.9 不可用（<3.12 基线）
uv = "0.10.11"
rust = "1.96.0"           # x86_64-pc-windows-msvc
webview2 = "151.0"        # Windows 内置

[debugger]
# debugpy 随应用打包分发（docs/python_debug_dev_plan.md v1.3 §3.4）：
# tools/fetch-debugpy.ps1 按 sha256 锁定拉取 cp310–cp314 win_amd64 五个 wheel，
# 解包合并到 vendor/debugpy/（.gitignore，不入库），经 tauri.conf.json bundle.resources 入包。
# 升级 debugpy：改 version + 五个 sha256，删 vendor/debugpy/ 重跑脚本，bench 回归全绿后合并。
debugpy = "1.8.21"
# sha256 锁定（PyPI 官方 JSON API，2026-09-10 校验）
debugpy_cp310_win_amd64 = "a7fe47fd23da57b9e0bec3f4a8ee65a2dc55782455ed7f2141d75ab5d2eaeef5"
debugpy_cp311_win_amd64 = "84c564d8cc701d41843b29a92814c1f1bef6798724ca9d675c284ad9f6a547d7"
debugpy_cp312_win_amd64 = "bd7ba9dd3daa7c2f942c6ca8d4695a16bf9ac16b63615261c7982bc74f7ed20c"
debugpy_cp313_win_amd64 = "aa648733047443eb1d07682c4ef287d36a54507b643ffdf38b09a3ef002c72a0"
debugpy_cp314_win_amd64 = "fe0744a12353406de0ae8ccff0d0a4a666f00801a3db8fd04e7a5f761cd520e8"

[fonts]
# JetBrains Mono 随包分发（docs/ui_premium_dev_plan.md 批 3 · ui_premium_design_report.md §5.3-3b）：
# tools/fetch-fonts.ps1 按 sha256 锁定，从 npm 官方镜像 @fontsource/jetbrains-mono 拉取
# 4 个 woff2 子集 + OFL.txt 到 shell/public/fonts/（**入库**，不走 vendor/ 机制）。
#
# 为什么入库而 debugpy 不入库（量级不同 + 通道不同）：
#   · 通道：@font-face 走 URL。bundle.resources 只对 Rust 文件系统可见（dap.rs:78-114
#     的四级查找全是路径拼接），prod 下 tauri 协议不服务资源目录 → 放 bundle.resources
#     时 @font-face 的 URL 无法预知安装路径（asset:// 需含用户名），且 vite dev 恒 404，
#     单测 / e2e / 基线截图门禁链会断。public/ 下 dev 与 prod 同为 'self' 相对 URL。
#   · 量级：4 个子集合计 71 KB，vs debugpy 20 MB。不入库的原始理由（仓库膨胀）不成立。
# 仍保留 sha256 锁 + 拉取脚本：为的是升级受控与可复现（换版本时必过锁值比对）。
#
# 上游对应 JetBrains Mono v2.304（fontsource 5.3.0 打包，2026-10-03 校验）。
# 升级：改 version + 五个 sha256 → -Force 重跑脚本 → audit + 截图对照 → 合并。
jetbrains_mono = "5.3.0"
jetbrains_mono_tgz = "1bbea47d1387406da5b6ccc4184cc61eae6851cc0db5c1d9bbd088ea9daa0b4a"
jetbrains_mono_latin_400_normal = "14425ba9c695763c1547f48a206b7aa60350a33ae23de09f0407877f3fcd89eb"
jetbrains_mono_latin_400_italic = "87ddac4a62229787528cf4ac3fa58137b62a9aec364c44fc0f40470bcda9efba"
jetbrains_mono_latin_700_normal = "d0d4e818808f2a0ba39b2b09d1989366f63494e295f003c7ef436697378507e8"
jetbrains_mono_latin_ext_400_normal = "505dfba8ecbe77e82765f36d317ed7ef4ac42719dc5f4ae68d1c483fd22d0d14"
jetbrains_mono_ofl = "403581b69dac5cff4079205e01c6b467e56af449ecbd7247693ddb1baafa005b"

[notes]
# - monaco-editor 与 monaco-languageclient 版本强耦合（ADR-0003 弃用后者的原因之一），
#   升级 Monaco 前需重新评估桥接层兼容性。
# - basedpyright 经 `uv tool install` 安装，升级：`uv tool upgrade basedpyright`。
# - bench 样例 venv 各自独立（bench/sample/*/pyproject.toml + uv.lock）。
