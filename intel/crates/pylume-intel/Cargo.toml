[package]
name = "pylume-intel"
version = "0.1.0"
edition = "2021"
description = "Pylume runtime intelligence LSP (Phase 3) — 消费 probe 的 SQLite trace 库，提供运行时补全/跳转/hover"
license = "MIT"

[[bin]]
name = "pylume-intel"
path = "src/main.rs"

[dependencies]
tower-lsp = "0.20.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
serde_json = "1"
parking_lot = "0.12"
pylume-intel-index = { path = "../pylume-intel-index" }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"